
name: Build Modbus Monitor Windows Portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ModbusMonitor main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModbusMonitor-Windows-Portable
          path: dist/ModbusMonitor.exe
          if-no-files-found: error
